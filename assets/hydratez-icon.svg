<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Light Water Blue Background -->
    <style>
      .bg { fill: #38BDF8; } /* Crisp Hydration Blue */
      .ink { fill: #0F172A; } /* Dark Charcoal/Black Ink */
    </style>
  </defs>

  <!-- Background -->
  <rect class="bg" width="500" height="500" rx="40"/>

  <!-- Imperfect Hand-Drawn Outer Swoosh -->
  <path class="ink" d="
    M 210, 52 
    C 310, 42 425, 105 448, 215 
    C 468, 312 410, 422 305, 442 
    C 195, 462 82, 395 62, 280 
    C 48, 198 95, 115 170, 75 
    C 178, 71 185, 78 180, 85 
    C 115, 122 75, 195 88, 270 
    C 105, 370 205, 432 300, 415 
    C 392, 398 442, 302 425, 210 
    C 405, 112 305, 58 212, 68 
    C 202, 69 200, 53 210, 52 Z
  "/>

  <!-- Integrated Drop + Z Mark -->
  <g class="ink">
    <!-- Water Drop Base -->
    <path d="
      M 250, 100 
      C 278, 145 335, 225 335, 285 
      A 85, 85 0 0 1 250, 370 
      A 85, 85 0 0 1 165, 285 
      C 165, 225 222, 145 250, 100 Z 
      M 250, 150 
      C 232, 185 198, 240 198, 285 
      A 52, 52 0 0 0 250, 337 
      A 52, 52 0 0 0 302, 285 
      C 302, 240 268, 185 250, 150 Z
    " fill-rule="evenodd"/>

    <!-- Sharp Z Overlay inside Drop -->
    <path d="
      M 210, 220 H 290 
      L 220, 300 H 290 
      V 320 H 210 
      L 280, 240 H 210 Z
    "/>
  </g>
</svg>
